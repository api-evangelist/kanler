name: Kanler
description: Kanler was a Redwood City, California home-improvement marketplace and construction
  technology company that connected homeowners with vetted home-improvement professionals and managed
  their projects end to end, positioning itself around price transparency and project peace of mind.
  Seed-funded in 2016 with backing from Battery Ventures, Floodgate Fund, TriplePoint Capital and
  Flight VC, the company later operated as a custom-home and whole-house remodeling firm. It was
  surfaced as a Battery Ventures portfolio company and added to the API Evangelist network. As of this
  enrichment pass its primary domain (kanler.com) returns HTTP 404 and no public developer, API, or
  documentation surface could be found, so no API artifacts were produced.
